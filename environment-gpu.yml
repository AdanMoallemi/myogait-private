name: dcm-gait
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - numpy>=1.24
  - pandas>=2.0
  - scipy>=1.11
  - matplotlib>=3.7
  - openpyxl>=3.1
  - pip:
      - torch>=2.2
      - torchvision
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - -e .[all]
      - streamlit>=1.30
      - onnxruntime-gpu
      - git+https://github.com/facebookresearch/sapiens2.git


